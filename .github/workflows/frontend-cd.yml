name: Frontend CD

on:

  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:

  deploy:

    runs-on: [self-hosted, s-collect-new]

    environment:
      name: production

    steps:

      - uses: actions/checkout@v5

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Images
        run: docker compose pull

      - name: Deploy
        run: docker compose up -d 
        

      - name: Remove old images
        run: docker image prune -af
